name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: SQLite e PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hypecards_teste

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Versão do pg_dump (usado no teste de backup)
        run: pg_dump --version

      - run: npm test
